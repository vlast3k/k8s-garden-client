{{- if .Values.nodeMonitoring.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-telegraf-config
  labels:
    app: node-telegraf
    component: cf-on-k8s
data:
  telegraf.conf: |
    [agent]
      interval = "60s"
      round_interval = true
      metric_batch_size = 1000
      metric_buffer_limit = 10000
      flush_interval = "60s"
      hostname = "$HOSTNAME"
      omit_hostname = false

    [global_tags]
      deployment = "cf-on-k8s"
      job = "k8s-node"

    [[inputs.cpu]]
      percpu = false
      totalcpu = true
      collect_cpu_time = false
      report_active = false

    [[inputs.mem]]

    [[inputs.swap]]

    [[inputs.disk]]
      ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs", "nsfs", "fuse.lxcfs"]

    [[inputs.diskio]]

    [[inputs.net]]
      ignore_protocol_stats = true
      interfaces = ["eth*", "ens*"]

    [[inputs.system]]

    [[outputs.socket_writer]]
      address = "tcp://{{ .Values.nodeMonitoring.address }}"
      data_format = "influx"
{{- end }}
